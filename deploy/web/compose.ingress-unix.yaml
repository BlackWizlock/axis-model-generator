services:
  api:
    networks:
      mg_edge:
        aliases: [mg-api]
  ingress:
    image: ${MG_INGRESS_IMAGE:?}
    user: 10001:10001
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    entrypoint: [sh, -c, 'umask 077; exec caddy run --config /etc/model-ingress.json']
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    volumes:
      - ./ingress-unix.json:/etc/model-ingress.json:ro
      - ${MG_SOCKET_ROOT:?}:/run/ingress
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001"]
    networks: [mg_edge]
